<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>明空与叶 · 动作验收台</title>
<style>body{background:#101922;color:#e2eee9;font:16px system-ui;margin:24px auto;max-width:1120px;padding:0 16px}h1{font-size:25px}button,select,input{font:inherit;background:#243743;color:inherit;border:1px solid #6a8694;border-radius:5px;padding:8px;margin:4px}button[aria-pressed=true]{background:#426854}canvas{width:100%;image-rendering:pixelated;background:#182831;border:1px solid #516578}#actions{display:flex;flex-wrap:wrap}p{line-height:1.7}.muted{color:#aec5ca}label{display:inline-block}input[type=range]{width:220px;vertical-align:middle}</style>
<h1>明空与叶 · 九动作与大招演出验收台</h1><p>连续动作候选，尚未经用户验收。两人均为辅助角色；技能与演出是游戏内改编候选。按动作按钮播放，倒地保持末帧，其余回待机；可关闭特效，独立检查身体运动。</p>
<label>角色 <select id="actor"><option value="mingkong">明空</option><option value="ye">叶</option></select></label><label>速度 <select id="speed"><option value="1">正常</option><option value="0.25">四分之一</option><option value="2">两倍</option></select></label><button id="pause">暂停</button><label><input type="checkbox" id="fx" checked>特效与镜头</label><label><input type="checkbox" id="loop">循环当前动作</label>
<div id="actions"></div><canvas id="stage" width="640" height="360" aria-label="角色动画与镜头演出"></canvas><p id="status" aria-live="polite">加载素材…</p><label>逐帧 <input id="seek" type="range" min="0" max="5" value="0"></label><p class="muted">检查：身份/服装稳定、脚接触、体积、关节轨迹、头发衣物延迟、正常速自然度、人设、回待机。大招附加检查镜头回归与亮度；降低动态效果偏好下自动关闭镜头与闪光。检查页不产生战斗结算。</p>
<script type="module">
const $=id=>document.getElementById(id),canvas=$('stage'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
const names={idle:'待机',attack:'基础援护',skill_1:'技能1',skill_2:'技能2',ultimate:'大招',hit:'受击',guard:'防御',down:'倒地',settlement:'结算'};
let data,img,action='idle',time=0,paused=false,last=0,loadVersion=0;
if(matchMedia('(prefers-reduced-motion: reduce)').matches)$('fx').checked=false;
function frames(){if(!data)return[];const tag=data.meta.frameTags.find(x=>x.name===action);return data.frames.slice(tag.from,tag.to+1)}
function play(id){action=id;time=0;paused=false;$('pause').textContent='暂停';for(const b of $('actions').children)b.setAttribute('aria-pressed',String(b.dataset.action===id));draw()}
for(const [id,label]of Object.entries(names)){const b=document.createElement('button');b.textContent=label;b.dataset.action=id;b.onclick=()=>play(id);$('actions').append(b)}
async function load(){const version=++loadVersion;const actor=$('actor').value;const [d,i]=await Promise.all([fetch('/party/'+actor+'/motion.json').then(r=>{if(!r.ok)throw Error('图集数据缺失');return r.json()}),new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>reject(Error('图集缺失'));i.src='/party/'+actor+'/motion.png'})]);if(version!==loadVersion)return;data=d;img=i;play('idle')}
function pixelRing(x,y,r,color){ctx.fillStyle=color;for(let a=0;a<Math.PI*2;a+=.075){const xx=Math.round((x+Math.cos(a)*r)/2)*2,yy=Math.round((y+Math.sin(a)*r*.48)/2)*2;ctx.fillRect(xx,yy,3,3)}}
function draw(){if(!data)return;const fs=frames(),duration=fs.reduce((s,f)=>s+f.duration,0);let elapsed=0,index=fs.length-1;for(let k=0;k<fs.length;k++){elapsed+=fs[k].duration;if(time<elapsed){index=k;break}}const f=fs[index],p=Math.min(1,time/duration),ult=action==='ultimate'&&$('fx').checked,m=$('actor').value==='mingkong';
ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#182831';ctx.fillRect(0,0,640,360);ctx.fillStyle='#243c45';for(let x=0;x<640;x+=32){ctx.fillRect(x,294,24,2);ctx.fillRect(x+8,324,12,2)}
ctx.save();if(ult){const z=1+.22*Math.sin(Math.PI*p),shake=p>.48&&p<.59?Math.round(Math.sin(p*230)*2):0;ctx.translate(320+shake,245);ctx.scale(z,z);ctx.translate(-320,-245);ctx.fillStyle=m?'#253642':'#153d37';ctx.fillRect(0,0,640,293)}
if(ult&&p>.25&&p<.85){const q=(p-.25)/.6;for(let j=0;j<4;j++)pixelRing(300,282,40+q*175+j*15,m?'#749da8':'#529f86');if(!m){ctx.fillStyle='#95d9b5';for(let j=0;j<7;j++){let x=180+j*44,y=190+Math.round(Math.sin(j+q*5)*35);ctx.fillRect(x,y,20,2);ctx.fillRect(x,y,2,14);ctx.fillRect(x+18,y,2,14);ctx.fillRect(x,y+12,20,2)}}}
const r=f.frame;ctx.drawImage(img,r.x,r.y,r.w,r.h,224,112,192,192);
if($('fx').checked&&['attack','skill_1','skill_2','ultimate'].includes(action)&&p>.32&&p<.85){ctx.fillStyle=m?'#e2dbac':'#94edbd';const count=ult?48:10;for(let j=0;j<count;j++){const q=(p*1.5+j*.071)%1,x=315+q*(ult?250:95),y=213+Math.sin(j*2.4+q*4)*(ult?85:28)-q*20;ctx.fillRect(Math.round(x/2)*2,Math.round(y/2)*2,2+j%2,2+j%2)}}ctx.restore();
if(ult&&p>.12&&p<.28){ctx.fillStyle='#0c151e';ctx.fillRect(0,22,640,70);ctx.save();ctx.beginPath();ctx.rect(360,24,210,66);ctx.clip();ctx.drawImage(img,r.x+55,r.y+12,80,60,335,-13,240,180);ctx.restore();ctx.fillStyle=m?'#d8e4ed':'#9bdbc4';ctx.font='18px system-ui';ctx.fillText(m?'守望 · 决意':'援护 · 调度',32,64)}
ctx.fillStyle='#cee4e3';ctx.font='14px system-ui';ctx.fillText(($('actor').value==='mingkong'?'明空':'叶')+' · '+names[action]+' · 候选',20,340);$('seek').max=fs.length-1;$('seek').value=index;$('status').textContent=names[action]+' '+(index+1)+'/'+fs.length+'帧 · '+Math.round(time)+' / '+duration+'ms'+(paused?' · 已暂停':'');}
$('actor').onchange=()=>load().catch(e=>$('status').textContent=e.message);$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'播放':'暂停';draw()};$('seek').oninput=()=>{paused=true;$('pause').textContent='播放';time=frames().slice(0,Number($('seek').value)).reduce((s,f)=>s+f.duration,0);draw()};$('fx').onchange=draw;
function tick(now){const dt=Math.min(now-last,100);last=now;if(data&&!paused){time+=dt*Number($('speed').value);const duration=frames().reduce((s,f)=>s+f.duration,0);if(time>=duration){if(action==='idle'||$('loop').checked)time%=duration;else if(action==='down'){time=duration-1;paused=true;$('pause').textContent='播放'}else play('idle')}draw()}requestAnimationFrame(tick)}requestAnimationFrame(tick);load().catch(e=>$('status').textContent=e.message);
</script></html>
