<style>
.rd,.rd *{margin:0;padding:0;box-sizing:border-box}
.rd{
  --ac:#d8a84e;--ac2:#c9564a;--ac-s:rgba(216,168,78,.14);--ac-l:rgba(216,168,78,.38);
  --ac-f:rgba(216,168,78,.16);
  /* 0916b：气泡内部**透明**——透出背景色，只留金色描边；不再用实心夜模式底色，也不要投影 */
  --bub:transparent;
  --ink:#e2ddcf;--dim:#6b7d8f;--sh:none;
  display:grid;grid-template-columns:104px 1fr;gap:16px;
  margin:20px 0;align-items:start;
  font-family:"Noto Serif SC","Source Han Serif SC","Songti SC",STSong,SimSun,Georgia,serif;
}
.rd-stone{position:relative;width:104px;height:104px;flex-shrink:0}
.rd-stone .rd-rp{position:absolute;inset:0;border-radius:50%;border:1px solid var(--ac);opacity:0;animation:rdR 4.6s ease-out infinite}
.rd-stone .rd-rp.r2{animation-delay:2.3s}
@keyframes rdR{0%{transform:scale(.72);opacity:.5}100%{transform:scale(1.6);opacity:0}}
.rd-stone .rd-orb{
  position:absolute;inset:6px;border-radius:50%;overflow:hidden;
  background:
    radial-gradient(circle at 40% 30%,rgba(255,255,255,.14),transparent 52%),
    radial-gradient(circle at 62% 70%,var(--ac-s),transparent 74%),
    var(--bub);
  border:2px solid var(--ac);display:grid;place-items:center;color:var(--ac);
  box-shadow:0 4px 16px var(--ac-s);
}
.rd-stone .rd-orb img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.rd-stone .rd-orb svg{width:38px;height:38px;display:var(--rd-av-user-svg,block)}
/* ── 0923 头像层：第 1 层专门留给「说话人是**玩家(user)**」时的 persona 原图 ──────
   正则替换是静态的，拿不到 persona 的头像文件名 ⇒ 反过来做「变量交接」：
   前端覆盖层（sigil-workbench.html 的 `mesSkinCss()`）往宿主 <html> 注一条
     `.mes[is_user="true"]{--rd-av-user:url(<persona 原图>);--rd-av-user-svg:none}`
   自定义属性会**继承**进气泡里的 .rd-orb，这里只用 var() 消费它。
   变量没设（AI 消息 / 前端没开）⇒ 第 1 层是 none，视觉与 0917 版**一字不差**。
   ★ 好处：与 user 叫什么名字**无关** —— persona 改名 / 换成别的名字照样显示。
   ★ 变量名或这个三层结构改了，要同步 mesSkinCss()。 */
.rd-stone .rd-orb{
  background-image:var(--rd-av-user,none),
    radial-gradient(circle at 40% 30%,rgba(255,255,255,.14),transparent 52%),
    radial-gradient(circle at 62% 70%,var(--ac-s),transparent 74%);
  background-size:cover,auto,auto;
  background-position:50% 16%,0 0,0 0;
  background-repeat:no-repeat,repeat,repeat;
}
.rd-stone .rd-moon{position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:var(--ac);offset-path:circle(49px at 0 0);animation:rdO 9s linear infinite;opacity:.8}
@keyframes rdO{to{offset-distance:100%}}
.rd-said{min-width:0;padding-top:6px}
.rd-who{font-size:17px;font-weight:700;letter-spacing:3px;color:var(--ac)}
.rd-who::first-letter{font-size:23px}
.rd-sw{width:min(200px,52%);height:10px;display:block;margin:2px 0 8px}
.rd-sw path{stroke:var(--ac);fill:none;opacity:.7}
.rd-sw circle{fill:var(--ac)}
.rd-bub{
  position:relative;background:var(--bub);border:1px solid var(--ac-l);
  border-radius:4px 28px 28px 28px;box-shadow:var(--sh);
  padding:14px 20px 14px 18px;
  font-size:15px;line-height:2.05;letter-spacing:.4px;
  color:var(--ink);
}
.rd-bub::before{content:'';position:absolute;left:-11px;top:1px;width:13px;height:13px;border-left:1px solid var(--ac-l);border-bottom:1px solid transparent;border-radius:0 0 0 15px}
.rd-bub::after{content:'';position:absolute;right:11px;bottom:-4px;width:8px;height:8px;border-radius:50%;border:1px solid var(--ac-l);background:var(--bub)}
@media(max-width:640px){
  .rd{grid-template-columns:78px 1fr;gap:12px}
  .rd-stone{width:78px;height:78px}
  .rd-stone .rd-orb{inset:5px}
  .rd-stone .rd-orb svg{width:26px;height:26px}
  .rd-stone .rd-moon{offset-path:circle(36px at 0 0);width:5px;height:5px;margin:-2.5px 0 0 -2.5px}
  .rd-bub{font-size:13.5px;padding:11px 15px}
}
